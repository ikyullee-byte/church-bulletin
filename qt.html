<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>새벽기도회 은혜의 나눔 (QT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(22, 32, 53, 0.82);
      --gold: #e5c158;
      --gold-soft: #f5e6b8;
      --text-main: #f4f6f9;
      --text-sub: #a9b3c6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: 100%;
      transition: font-size 0.2s ease;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* 배경 별빛 캔버스 */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(180deg, #131d36 0%, #0a0f1d 100%);
    }

    /* 모바일 컨테이너 */
    .mobile-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .serif {
      font-family: 'Nanum Myeongjo', serif;
    }

    /* 스크롤 등장 애니메이션 */
    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      transition: all 0.6s ease-out;
    }
    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 상단 고정 바 (날짜 탭 + 글자 크기 조절) */
    .top-bar-wrap {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(10px);
      margin: 0 -18px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(229, 193, 88, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-selector-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      flex: 1;
    }
    .day-selector-wrap::-webkit-scrollbar {
      display: none;
    }
    .day-btn {
      background: var(--card-bg);
      border: 1px solid rgba(229, 193, 88, 0.35);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .day-btn.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.35);
    }

    /* 글자 크기 조절 버튼 */
    .font-control {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .font-btn {
      background: rgba(229, 193, 88, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(229, 193, 88, 0.1);
    }

    /* 1. 상단 표지 */
    .hero {
      padding: 34px 0 24px;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--gold);
      border: 1px solid rgba(229, 193, 88, 0.4);
      background: rgba(229, 193, 88, 0.08);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: 1.75rem;
      line-height: 1.35;
      color: #fff;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-sub {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .info-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 0.82rem;
    }

    .info-item strong {
      display: block;
      color: var(--gold);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    /* 공통 섹션 & 카드 */
    section {
      margin-bottom: 28px;
      scroll-margin-top: 65px;
    }

    .sec-title {
      font-size: 1.15rem;
      color: var(--gold-soft);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--gold);
      border-radius: 2px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* 성경 본문 구절 전체 보기 스타일 */
    .verse-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.75;
      color: #dbe2ef;
      word-break: keep-all;
    }
    .verse-item:last-child {
      margin-bottom: 0;
    }
    .verse-item.highlight {
      color: #ffffff;
      background: rgba(229, 193, 88, 0.08);
      border-left: 3px solid var(--gold);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }
    .v-num {
      color: var(--gold);
      font-weight: 700;
      margin-right: 6px;
      font-size: 0.88rem;
    }

    /* 설교 3대 포인트 카드 */
    .point-card {
      border-left: 3px solid var(--gold);
    }

    .point-tag {
      font-size: 0.72rem;
      color: #0a0f1d;
      background: var(--gold);
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .point-card h3 {
      font-size: 1.12rem;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .point-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .key-quote {
      background: rgba(229, 193, 88, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: var(--gold-soft);
      font-weight: 500;
    }

    /* 미니 비교 박스 */
    .name-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
      text-align: center;
    }
    .name-item {
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .name-old {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sub);
    }
    .name-new {
      background: rgba(229, 193, 88, 0.18);
      border: 1px solid var(--gold);
      color: #fff;
    }

    /* 공동 기도 제목 리스트 */
    .prayer-list {
      list-style: none;
    }
    .prayer-list li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      color: var(--text-main);
    }
    .prayer-list li:last-child {
      margin-bottom: 0;
    }
    .prayer-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--gold);
    }
    .prayer-list strong {
      color: var(--gold-soft);
      display: block;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    /* 통성기도 강조 박스 */
    .cry-box {
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.2), rgba(22, 32, 53, 0.95));
      border: 1px solid var(--gold);
      text-align: center;
    }
    .cry-title {
      font-size: 1.25rem;
      color: var(--gold);
      font-weight: 800;
      margin: 10px 0;
      letter-spacing: 2px;
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.8; }
      to { opacity: 1; text-shadow: 0 0 12px var(--gold); }
    }

    /* =========================================================================
       🙏 [참여 기능 스타일 - '아멘' 좋아요 & 은혜 나눔 댓글창]
       ========================================================================= */
    .engage-box {
      text-align: center;
      padding: 24px 20px;
      background: linear-gradient(180deg, rgba(22, 32, 53, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);
      border: 1px solid rgba(229, 193, 88, 0.25);
    }
    .amen-btn {
      background: rgba(229, 193, 88, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(229, 193, 88, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .amen-btn:active {
      transform: scale(0.96);
      background: var(--gold);
      color: #0a0f1d;
    }
    .amen-count {
      background: var(--gold);
      color: #0a0f1d;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* 댓글 입력폼 & 목록 */
    .comment-form {
      margin-top: 18px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .comment-input, .name-input {
      width: 100%;
      background: rgba(10, 15, 29, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.88rem;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .comment-input:focus, .name-input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .comment-submit-btn {
      background: var(--gold);
      color: #0a0f1d;
      border: none;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .comment-submit-btn:active { opacity: 0.8; }

    .comment-list {
      margin-top: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }
    .comment-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--gold-soft);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .comment-text {
      font-size: 0.86rem;
      color: var(--text-main);
      word-break: break-all;
    }

    /* 하단 고정 네비게이션 */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 440px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 193, 88, 0.35);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      padding: 10px 6px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .bottom-nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 16px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .bottom-nav a.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
    }
    .nav-notice-btn {
      color: var(--gold) !important;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="mobile-wrap">
    <!-- 상단 요일 탭 & 글자 크기 버튼 -->
    <div class="top-bar-wrap">
      <div id="daySelector" class="day-selector-wrap"></div>
      <div class="font-control">
        <button class="font-btn" onclick="adjustFontSize(-0.08)">가-</button>
        <button class="font-btn" onclick="adjustFontSize(0.08)">가+</button>
      </div>
    </div>

    <!-- 성도용 큐티 영역 -->
    <div id="contentArea"></div>
  </div>

  <!-- 하단 고정 탭바 -->
  <nav class="bottom-nav">
    <a href="#top" class="nav-link active">표지</a>
    <a href="#word" class="nav-link">말씀본문</a>
    <a href="#sermon" class="nav-link">설교핵심</a>
    <a href="#prayer" class="nav-link">합심기도</a>
    <a href="notice.html" class="nav-notice-btn">📢 공지·일정</a>
  </nav>

  <script>
    // =========================================================================
    // 🔠 [글자 크기 조절 기능]
    // =========================================================================
    let currentFontScale = 1.0;
    function adjustFontSize(delta) {
      currentFontScale += delta;
      if (currentFontScale < 0.8) currentFontScale = 0.8;
      if (currentFontScale > 1.4) currentFontScale = 1.4;
      document.documentElement.style.fontSize = `${currentFontScale * 100}%`;
    }

    // =========================================================================
    // 📂 [성도용 새벽기도 나눔 데이터 (10.26 월요일 포함)]
    // =========================================================================
    const sermons = {
      "2026-11-13": {
        tabLabel: "📅 11.13 (금) 새벽",

        titleHtml: "<span>버린 은</span>이 되지 말고<br>정금으로 단련되라",
        subtitle: "예레미야 강해",
        bibleRange: "예레미야 6:22-30",
        hymn: "183장 · 347장 · 197장 · 539장",
        time: "새벽 5:00",

        openingPrayer: "한 주간 새벽마다 말씀으로 우리를 깨우시고 일으켜 주신 하나님 아버지. 한 주를 마무리하는 금요일 새벽, 다시 주님 앞에 나아오게 하시니 감사드립니다. 이번 주 동안 우리의 출입을 지켜 주시고 말씀으로 먹여 주신 은혜를 찬양합니다. 부족했던 걸음을 주님께 고백하오니 긍휼히 여겨 주옵소서. 말씀 앞에 선 우리 모두에게 성령의 기름을 부어 주시고, 오늘 주시는 말씀으로 추수감사주일을 준비하게 하실 줄 믿사오며, 예수 그리스도의 이름으로 기도드리옵나이다. 아멘.",

        verses: [
          { num: "22", text: "여호와께서 이와 같이 말씀하시되 보라 한 민족이 북방에서 오며 큰 나라가 땅 끝에서부터 떨쳐 일어나나니" },
          { num: "23", text: "그들은 활과 창을 잡았고 잔인하여 사랑이 없으며 그 목소리는 바다처럼 포효하는 소리라 그들이 말을 타고 전사 같이 다 대열을 벌이고 시온의 딸인 너를 치려 하느니라 하시도다" },
          { num: "24", text: "우리가 그 소문을 들었으므로 손이 약하여졌고 고통이 우리를 잡았으므로 그 아픔이 해산하는 여인 같도다" },
          { num: "25", text: "너희는 밭에도 나가지 말라 길로도 다니지 말라 원수의 칼이 있고 사방에 두려움이 있음이라" },
          { num: "26", text: "딸 내 백성이 굵은 베를 두르고 재에서 구르며 독자를 잃음 같이 슬퍼하며 통곡할지어다 멸망시킬 자가 갑자기 우리에게 올 것임이라" },
          { num: "27", text: "내가 이미 너를 내 백성 중에 망대와 요새로 삼아 그들의 길을 알고 살피게 하였노라" },
          { num: "28", text: "그들은 다 심히 반역한 자며 비방하며 돌아다니는 자며 그들은 놋과 철이며 다 사악한 자라" },
          { num: "29", text: "풀무불을 맹렬히 불면 그 불에 납이 살라져서 단련하는 자의 일이 헛되게 되느니라 이와 같이 악한 자가 제거되지 아니하나니" },
          { num: "30", text: "사람들이 그들을 내버린 은이라 부르게 될 것은 여호와께서 그들을 버렸음이라" }
        ],

        points: [
          {
            tag: "은혜 01",
            title: "두려움이 닥쳐올 때 굵은 베를 두르고 주님께 엎드려야 합니다 (22-26절)",
            desc: "사랑하는 성도 여러분, 살다 보면 우리도 \"사방에 두려움이 있다\"고 느낄 때가 있습니다. 건강 검사 결과를 기다릴 때, 자녀 문제로 밤잠을 설칠 때, 일터가 흔들릴 때 손에 힘이 빠집니다. 그때 두려움에 갇혀 있지 말고, 두려움을 들고 주님께로 나아오십시오.",
            quote: "💡 딸 내 백성이 굵은 베를 두르고 재에서 구르며 독자를 잃음 같이 슬퍼하며 통곡할지어다 멸망시킬 자가 갑자기 우리에게 올 것임이라"
          },
          {
            tag: "은혜 02",
            title: "하나님은 우리를 시험하고 살피시는 단련자이십니다 (27-28절)",
            desc: "성도 여러분, 하나님은 오늘도 우리 삶을 살피십니다. 예배당 안의 모습보다 일터와 가정에서의 모습, 사람들 앞에서 하는 말보다 돌아서서 하는 말 속에서 우리가 은인지 놋인지 드러납니다. 시편 139편 23절의 기도를 우리 기도로 삼으십시오.",
            quote: "💡 내가 이미 너를 내 백성 중에 망대와 요새로 삼아 그들의 길을 알고 살피게 하였노라"
          },
          {

    const isPreview = urlParams.get('preview') === '1' || window.location.protocol === 'file:';

      if (isPreview) return allKeys;
      const now = new Date();
      return allKeys.filter(key => {
        const releaseTime = new Date(`${key}T04:00:00+09:00`);
        return now >= releaseTime;
      });
    }

    if (visibleKeys.length === 0) {
      visibleKeys = [allKeys[allKeys.length - 1]];
    }
    let currentKey = visibleKeys[0];

      visibleKeys = getVisibleKeys();

      currentKey = targetKey;
      const data = sermons[targetKey];

              <input type="text" id="commenterName" class="name-input" placeholder="이름 (예: 홍길동 성도)" />
              <textarea id="commentText" class="comment-input" rows="2" placeholder="오늘 은혜받은 말씀이나 기도 제목을 남겨주세요"></textarea>
              <button class="comment-submit-btn" id="commentSubmitBtn" onclick="handlePostComment('${targetKey}')">은혜 나누기 등록</button>
              ${shareNotice}
            </div>

            <div class="comment-list" id="commentListArea">
              ${commentsHtml}
            </div>
          </div>
        </section>
      `;

      document.getElementById('contentArea').innerHTML = contentHtml;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      if (SHARE_URL) loadShared(targetKey);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function buildCommentsHtml(comments) {
      if (comments.length === 0) {
        return `<div style="text-align:center; font-size:0.82rem; color:var(--text-sub); padding:10px;">첫 번째 은혜 나눔을 남겨보세요!</div>`;
      }
      return comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <span>👤 ${escapeHtml(c.name)}</span>
              <span>${escapeHtml(c.date)}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `).join('');
    }

    function getLocalComments(key) {
      try { return JSON.parse(localStorage.getItem(`comments_${key}`) || '[]'); } catch (e) { return []; }
    }

    // 공유 저장소에서 해당 날짜의 '아멘' 수와 은혜 나눔을 받아 화면에 반영
    async function loadShared(key) {
      try {
        const res = await fetch(`${SHARE_URL}?key=${encodeURIComponent(key)}`);
        const result = await res.json();
        if (key !== currentKey) return;
        const list = document.getElementById('commentListArea');
        const badge = document.getElementById('amenCountBadge');
        if (list) list.innerHTML = buildCommentsHtml(result.comments || []);
        if (badge) badge.innerText = result.amen || 0;
      } catch (e) {
        const list = document.getElementById('commentListArea');
        if (list && key === currentKey) {
          list.innerHTML = `<div style="text-align:center; font-size:0.82rem; color:var(--text-sub); padding:10px;">은혜 나눔을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>`;
        }
      }
    }

    // 공유 저장소에 기록 (text/plain으로 보내야 구글 앱스 스크립트가 바로 받음)
    function postShared(payload) {
      return fetch(SHARE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    // '아멘' 버튼 클릭 핸들러
    function handleAmen(key) {
      const badge = document.getElementById('amenCountBadge');
      if (SHARE_URL) {
        const shown = parseInt(badge && badge.innerText) || 0;
        if (badge) badge.innerText = shown + 1;
        postShared({ action: 'amen', key }).catch(() => {});
        return;
      }
      const amenKey = `amen_${key}`;
      let count = parseInt(localStorage.getItem(amenKey) || '0');
      count++;
      localStorage.setItem(amenKey, count);
      if (badge) badge.innerText = count;
    }

    // 댓글 등록 핸들러
    async function handlePostComment(key) {
      const nameInput = document.getElementById('commenterName');
      const textInput = document.getElementById('commentText');
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        alert('이름과 내용을 모두 입력해 주세요.');
        return;
      }

      if (SHARE_URL) {
        const btn = document.getElementById('commentSubmitBtn');
        if (btn) { btn.disabled = true; btn.innerText = '등록 중…'; }
        try {
          const result = await postShared({ action: 'comment', key, name, text });
          if (!result.ok) throw new Error('rejected');
          textInput.value = '';
          await loadShared(key);
        } catch (e) {
          alert('등록하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.');
        } finally {
          if (btn) { btn.disabled = false; btn.innerText = '은혜 나누기 등록'; }
        }
        return;
      }

      const comments = getLocalComments(key);
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      comments.unshift({ name, text, date: dateStr });
      localStorage.setItem(`comments_${key}`, JSON.stringify(comments));

      textInput.value = '';
      renderApp(currentKey); // 화면 갱신
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('show');
      });
    }, { threshold: 0.08 });

    renderApp(currentKey);

    setInterval(() => {
      const updatedKeys = getVisibleKeys();
      if (updatedKeys.length !== visibleKeys.length) {
        renderApp(updatedKeys[0]);
      } else if (SHARE_URL && !document.hidden) {
        loadShared(currentKey); // 다른 성도님이 남긴 글도 보이도록 새로고침
      }
    }, 30000);

    const links = document.querySelectorAll('.nav-link');
    const sections = ['top', 'word', 'sermon', 'prayer'];

    window.addEventListener('scroll', () => {
      let current = 'top';
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && window.scrollY >= el.offsetTop - 220) {
          current = id;
        }
      });
      links.forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === '#' + current);
      });
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),
        da: Math.random() * 0.015 + 0.005,
        dy: -(Math.random() * 0.2 + 0.05)
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.y += s.dy;
        s.a += s.da;
        if (s.a > 0.9 || s.a < 0.1) s.da *= -1;
        if (s.y < 0) s.y = canvas.height;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(229, 193, 88, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
</body>
</html>
