<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>새벽기도회 은혜의 나눔 (QT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(22, 32, 53, 0.82);
      --gold: #e5c158;
      --gold-soft: #f5e6b8;
      --text-main: #f4f6f9;
      --text-sub: #a9b3c6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: 100%;
      transition: font-size 0.2s ease;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* 배경 별빛 캔버스 */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(180deg, #131d36 0%, #0a0f1d 100%);
    }

    /* 모바일 컨테이너 */
    .mobile-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .serif {
      font-family: 'Nanum Myeongjo', serif;
    }

    /* 스크롤 등장 애니메이션 */
    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      transition: all 0.6s ease-out;
    }
    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 상단 고정 바 (날짜 탭 + 글자 크기 조절) */
    .top-bar-wrap {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(10px);
      margin: 0 -18px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(229, 193, 88, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-selector-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      flex: 1;
    }
    .day-selector-wrap::-webkit-scrollbar {
      display: none;
    }
    .day-btn {
      background: var(--card-bg);
      border: 1px solid rgba(229, 193, 88, 0.35);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .day-btn.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.35);
    }

    /* 글자 크기 조절 버튼 */
    .font-control {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .font-btn {
      background: rgba(229, 193, 88, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(229, 193, 88, 0.1);
    }

    /* 1. 상단 표지 */
    .hero {
      padding: 34px 0 24px;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--gold);
      border: 1px solid rgba(229, 193, 88, 0.4);
      background: rgba(229, 193, 88, 0.08);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: 1.75rem;
      line-height: 1.35;
      color: #fff;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-sub {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .info-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 0.82rem;
    }

    .info-item strong {
      display: block;
      color: var(--gold);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    /* 공통 섹션 & 카드 */
    section {
      margin-bottom: 28px;
      scroll-margin-top: 65px;
    }

    .sec-title {
      font-size: 1.15rem;
      color: var(--gold-soft);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--gold);
      border-radius: 2px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* 성경 본문 구절 전체 보기 스타일 */
    .verse-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.75;
      color: #dbe2ef;
      word-break: keep-all;
    }
    .verse-item:last-child {
      margin-bottom: 0;
    }
    .verse-item.highlight {
      color: #ffffff;
      background: rgba(229, 193, 88, 0.08);
      border-left: 3px solid var(--gold);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }
    .v-num {
      color: var(--gold);
      font-weight: 700;
      margin-right: 6px;
      font-size: 0.88rem;
    }

    /* 설교 3대 포인트 카드 */
    .point-card {
      border-left: 3px solid var(--gold);
    }

    .point-tag {
      font-size: 0.72rem;
      color: #0a0f1d;
      background: var(--gold);
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .point-card h3 {
      font-size: 1.12rem;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .point-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .key-quote {
      background: rgba(229, 193, 88, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: var(--gold-soft);
      font-weight: 500;
    }

    /* 미니 비교 박스 */
    .name-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
      text-align: center;
    }
    .name-item {
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .name-old {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sub);
    }
    .name-new {
      background: rgba(229, 193, 88, 0.18);
      border: 1px solid var(--gold);
      color: #fff;
    }

    /* 공동 기도 제목 리스트 */
    .prayer-list {
      list-style: none;
    }
    .prayer-list li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      color: var(--text-main);
    }
    .prayer-list li:last-child {
      margin-bottom: 0;
    }
    .prayer-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--gold);
    }
    .prayer-list strong {
      color: var(--gold-soft);
      display: block;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    /* 통성기도 강조 박스 */
    .cry-box {
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.2), rgba(22, 32, 53, 0.95));
      border: 1px solid var(--gold);
      text-align: center;
    }
    .cry-title {
      font-size: 1.25rem;
      color: var(--gold);
      font-weight: 800;
      margin: 10px 0;
      letter-spacing: 2px;
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.8; }
      to { opacity: 1; text-shadow: 0 0 12px var(--gold); }
    }

    /* =========================================================================
       🙏 [참여 기능 스타일 - '아멘' 좋아요 & 은혜 나눔 댓글창]
       ========================================================================= */
    .engage-box {
      text-align: center;
      padding: 24px 20px;
      background: linear-gradient(180deg, rgba(22, 32, 53, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);
      border: 1px solid rgba(229, 193, 88, 0.25);
    }
    .amen-btn {
      background: rgba(229, 193, 88, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(229, 193, 88, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .amen-btn:active {
      transform: scale(0.96);
      background: var(--gold);
      color: #0a0f1d;
    }
    .amen-count {
      background: var(--gold);
      color: #0a0f1d;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* 댓글 입력폼 & 목록 */
    .comment-form {
      margin-top: 18px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .comment-input, .name-input {
      width: 100%;
      background: rgba(10, 15, 29, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.88rem;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .comment-input:focus, .name-input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .comment-submit-btn {
      background: var(--gold);
      color: #0a0f1d;
      border: none;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .comment-submit-btn:active { opacity: 0.8; }

    .comment-list {
      margin-top: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }
    .comment-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--gold-soft);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .comment-text {
      font-size: 0.86rem;
      color: var(--text-main);
      word-break: break-all;
    }

    /* 하단 고정 네비게이션 */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 440px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 193, 88, 0.35);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      padding: 10px 6px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .bottom-nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 16px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .bottom-nav a.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
    }
    .nav-notice-btn {
      color: var(--gold) !important;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="mobile-wrap">
    <!-- 상단 요일 탭 & 글자 크기 버튼 -->
    <div class="top-bar-wrap">
      <div id="daySelector" class="day-selector-wrap"></div>
      <div class="font-control">
        <button class="font-btn" onclick="adjustFontSize(-0.08)">가-</button>
        <button class="font-btn" onclick="adjustFontSize(0.08)">가+</button>
      </div>
    </div>

    <!-- 성도용 큐티 영역 -->
    <div id="contentArea"></div>
  </div>

  <!-- 하단 고정 탭바 -->
  <nav class="bottom-nav">
    <a href="#top" class="nav-link active">표지</a>
    <a href="#word" class="nav-link">말씀본문</a>
    <a href="#sermon" class="nav-link">설교핵심</a>
    <a href="#prayer" class="nav-link">합심기도</a>
    <a href="notice.html" class="nav-notice-btn">📢 공지·일정</a>
  </nav>

  <script>
    // =========================================================================
    // 🔠 [글자 크기 조절 기능]
    // =========================================================================
    let currentFontScale = 1.0;
    function adjustFontSize(delta) {
      currentFontScale += delta;
      if (currentFontScale < 0.8) currentFontScale = 0.8;
      if (currentFontScale > 1.4) currentFontScale = 1.4;
      document.documentElement.style.fontSize = `${currentFontScale * 100}%`;
    }

    // =========================================================================
    // 📂 [성도용 새벽기도 나눔 데이터 (10.26 월요일 포함)]
    // =========================================================================
    const sermons = {
      "2026-10-30": {
        tabLabel: "📅 10.30 (금) 새벽",
        dateBadge: "2026. 10. 30 (금) 새벽 5시 기도회",
        titleHtml: "<span>배역한 이스라엘</span>과 반역한 유다,<br>상처를 싸매시는 목자",
        subtitle: "배역한 자식들아 돌아오라",
        bibleRange: "예레미야 3:6-18",
        hymn: "275장",
        time: "새벽 5:00",

        openingPrayer: "한결같은 사랑으로 우리를 붙들어 주시는 하나님 아버지. 10월의 마지막 평일 새벽입니다. 한 달 동안 우리의 출입을 지켜 주시고 여기까지 인도하신 은혜에 감사드립니다. 이 한 달 주님 앞에 부족했던 모든 것을 고백하오니 긍휼히 여겨 주옵소서. 이 새벽 우리 마음을 고요하게 하시고, 말씀을 전하는 종에게 성령의 기름을 부어 주옵소서. 오늘 주시는 말씀으로 한 주와 한 달을 정직하게 마무리하게 하실 줄 믿사오며, 예수 그리스도의 이름으로 기도드립니다. 아멘.",

        verses: [
          { num: "6", text: "요시야 왕 때에 여호와께서 또 내게 이르시되 너는 배역한 이스라엘이 행한 바를 보았느냐 그가 모든 높은 산에 오르며 모든 푸른 나무 아래로 가서 거기서 행음하였도다" },
          { num: "7", text: "그가 이 모든 일들을 행한 후에 내가 말하기를 그가 내게로 돌아오리라 하였으나 아직도 내게로 돌아오지 아니하였고 그의 반역한 자매 유다는 그것을 보았느니라" },
          { num: "8", text: "내게 배역한 이스라엘이 간음을 행하였으므로 내가 그를 내쫓고 그에게 이혼서까지 주었으되 그의 반역한 자매 유다가 두려워하지 아니하고 자기도 가서 행음함을 내가 보았노라" },
          { num: "9", text: "그가 돌과 나무와 더불어 행음함을 가볍게 여기고 행음하여 이 땅을 더럽혔거늘" },
          { num: "10", text: "이 모든 일이 있어도 그의 반역한 자매 유다가 진심으로 내게 돌아오지 아니하고 거짓으로 할 뿐이니라 여호와의 말씀이니라" },
          { num: "11", text: "여호와께서 내게 이르시되 배역한 이스라엘은 반역한 유다보다 자신이 더 의로움이 나타났나니" },
          { num: "12", text: "너는 가서 북을 향하여 이 말을 선포하여 이르라 여호와께서 이르시되 배역한 이스라엘아 돌아오라 나의 노한 얼굴을 너희에게로 향하지 아니하리라 나는 긍휼이 있는 자라 노를 한없이 품지 아니하느니라 여호와의 말씀이니라" },
          { num: "13", text: "너는 오직 네 죄를 자복하라 이는 네 하나님 여호와를 배반하고 네 길로 달려 이방인들에게로 나아가 모든 푸른 나무 아래로 가서 내 목소리를 듣지 아니하였음이라 여호와의 말씀이니라" },
          { num: "14", text: "여호와의 말씀이니라 배역한 자식들아 돌아오라 나는 너희 남편임이라 내가 너희를 성읍에서 하나와 족속 중에서 둘을 택하여 너희를 시온으로 데려오겠고" },
          { num: "15", text: "내가 또 내 마음에 합한 목자들을 너희에게 주리니 그들이 지식과 명철로 너희를 양육하리라" },
          { num: "16", text: "여호와의 말씀이니라 너희가 이 땅에서 번성하여 많아질 때에는 사람들이 여호와의 언약궤를 다시는 말하지 아니할 것이요 생각하지 아니할 것이요 기억하지 아니할 것이요 찾지 아니할 것이요 다시는 만들지 아니할 것이며" },
          { num: "17", text: "그 때에 예루살렘이 그들에게 여호와의 보좌라 일컬음이 되며 모든 백성이 그리로 모이리니 곧 여호와의 이름으로 말미암아 예루살렘에 모이고 다시는 그들의 악한 마음의 완악한 대로 그들이 행하지 아니할 것이며" },
          { num: "18", text: "그 때에 유다 족속이 이스라엘 족속과 동행하여 북에서부터 나와서 내가 너희 조상들에게 기업으로 준 땅에 그들이 함께 이르리라" }
        ],

        points: [
          {

    // =========================================================================
    // 🗂 [은혜 나눔 공유 저장소]
    // 구글 앱스 스크립트 웹 앱 주소를 넣으면 모든 성도가 같은 글을 봅니다.
    // 비워 두면 예전처럼 각자의 휴대폰에만 저장됩니다. (설정법: qt-share/설정방법.md)
    // =========================================================================
    const SHARE_URL = 'https://script.google.com/macros/s/AKfycby0VyPbHIbqjNxdnMNNIw4cP4TQwPxQsevAia3sjMRcyc_rAF9cmtlJh9cXOc6Sze2b/exec';

    // =========================================================================
    // ⏰ [새벽 4시 자동 공개 필터링 및 렌더링 스크립트]
    // =========================================================================
    const allKeys = Object.keys(sermons);
    const urlParams = new URLSearchParams(window.location.search);
    const isPreview = urlParams.get('preview') === '1' || window.location.protocol === 'file:';

    function getVisibleKeys() {
      if (isPreview) return allKeys;
      const now = new Date();
      return allKeys.filter(key => {
        const releaseTime = new Date(`${key}T04:00:00+09:00`);
        return now >= releaseTime;
      });
    }

    let visibleKeys = getVisibleKeys();
    if (visibleKeys.length === 0) {
      visibleKeys = [allKeys[allKeys.length - 1]];
    }
    let currentKey = visibleKeys[0];

    function renderApp(targetKey) {
      visibleKeys = getVisibleKeys();
      if (visibleKeys.length === 0) visibleKeys = [allKeys[allKeys.length - 1]];
      if (!visibleKeys.includes(targetKey)) targetKey = visibleKeys[0];

      currentKey = targetKey;
      const data = sermons[targetKey];

      let selectorHtml = '';
      visibleKeys.forEach((k) => {
        const activeClass = k === targetKey ? 'active' : '';
        selectorHtml += `<button class="day-btn ${activeClass}" onclick="renderApp('${k}')">${sermons[k].tabLabel}</button>`;
      });
      document.getElementById('daySelector').innerHTML = selectorHtml;

      let versesHtml = '';
      data.verses.forEach(v => {
        const highlightClass = v.key ? 'highlight' : '';
        versesHtml += `<div class="verse-item ${highlightClass}"><span class="v-num">${v.num}</span>${v.text}</div>`;
      });

      let pointsHtml = '';
      data.points.forEach(p => {
        let compareHtml = '';
        if (p.compareBox) {
          compareHtml = `
            <div class="name-box">
              <div class="name-item name-old">
                <small>${p.compareBox.oldLabel}</small><br><strong>${p.compareBox.oldVal}</strong>
              </div>
              <div class="name-item name-new">
                <small>${p.compareBox.newLabel}</small><br><strong>${p.compareBox.newVal}</strong>
              </div>
            </div>
          `;
        }

        pointsHtml += `
          <div class="card point-card fade-up">
            <span class="point-tag">${p.tag}</span>
            <h3 class="serif">${p.title}</h3>
            <p class="point-desc">${p.desc}</p>
            ${compareHtml}
            <div class="key-quote">${p.quote}</div>
          </div>
        `;
      });

      let prayersHtml = '';
      data.prayers.forEach(pr => {
        prayersHtml += `
          <li>
            <strong>${pr.title}</strong>
            ${pr.desc}
          </li>
        `;
      });

      // '아멘' 수와 은혜 나눔: 공유 저장소가 있으면 거기서, 없으면 이 기기에서 불러오기
      const amenCount = SHARE_URL ? '…' : parseInt(localStorage.getItem(`amen_${targetKey}`) || '0');
      const commentsHtml = SHARE_URL
        ? `<div style="text-align:center; font-size:0.82rem; color:var(--text-sub); padding:10px;">은혜 나눔을 불러오는 중입니다…</div>`
        : buildCommentsHtml(getLocalComments(targetKey));
      const shareNotice = SHARE_URL ? '' :
        `<p style="font-size:0.74rem; color:var(--text-sub); margin-top:8px;">※ 지금은 남긴 글이 이 휴대폰에만 저장됩니다.</p>`;

      const contentHtml = `
        <header class="hero fade-up" id="top">
          <div class="date-badge">${data.dateBadge}</div>
          <h1 class="serif">${data.titleHtml}</h1>
          <p class="hero-sub">${data.subtitle}</p>

          <div class="info-bar">
            <div class="info-item">
              <strong>본문</strong>
              <span>${data.bibleRange}</span>
            </div>
            <div class="info-item">
              <strong>찬송</strong>
              <span>${data.hymn}</span>
            </div>
            <div class="info-item">
              <strong>예배시간</strong>
              <span>${data.time}</span>
            </div>
          </div>
        </header>

        <section class="fade-up">
          <div class="card">
            <p style="font-size: 0.92rem; color: var(--gold-soft); font-style: italic;">
              "${data.openingPrayer}"
            </p>
          </div>
        </section>

        <section id="word" class="fade-up">
          <h2 class="sec-title serif">오늘의 성경 본문 (${data.bibleRange})</h2>
          <div class="card serif">
            ${versesHtml}
          </div>
        </section>

        <section id="sermon">
          <h2 class="sec-title serif fade-up">오늘의 말씀 핵심</h2>
          ${pointsHtml}
        </section>

        <section id="prayer" class="fade-up">
          <h2 class="sec-title serif">오늘의 공동 기도 제목</h2>
          <div class="card">
            <ul class="prayer-list">${prayersHtml}</ul>
          </div>

          <div class="card cry-box fade-up">
            <span class="point-tag">새벽 합심 기도</span>
            <p style="font-size: 0.9rem; color: #fff;">${data.cryIntro}</p>
            <div class="cry-title serif">주여! 주여! 주여!</div>
            <p style="font-size: 0.9rem; color: var(--gold-soft); text-align: left; margin-top: 10px;">
              "${data.cryPrayer}"
            </p>
          </div>
        </section>

        <!-- 🙏 참여 섹션 ('아멘' 좋아요 & 은혜 나눔 댓글) -->
        <section class="fade-up">
          <h2 class="sec-title serif">은혜 나눔 및 참여</h2>
          <div class="card engage-box">
            <button class="amen-btn" onclick="handleAmen('${targetKey}')">
              🙏 아멘 (은혜요청) <span class="amen-count" id="amenCountBadge">${amenCount}</span>
            </button>

            <div class="comment-form">
              <input type="text" id="commenterName" class="name-input" placeholder="이름 (예: 홍길동 성도)" />
              <textarea id="commentText" class="comment-input" rows="2" placeholder="오늘 은혜받은 말씀이나 기도 제목을 남겨주세요"></textarea>
              <button class="comment-submit-btn" id="commentSubmitBtn" onclick="handlePostComment('${targetKey}')">은혜 나누기 등록</button>
              ${shareNotice}
            </div>

            <div class="comment-list" id="commentListArea">
              ${commentsHtml}
            </div>
          </div>
        </section>
      `;

      document.getElementById('contentArea').innerHTML = contentHtml;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      if (SHARE_URL) loadShared(targetKey);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function buildCommentsHtml(comments) {
      if (comments.length === 0) {
        return `<div style="text-align:center; font-size:0.82rem; color:var(--text-sub); padding:10px;">첫 번째 은혜 나눔을 남겨보세요!</div>`;
      }
      return comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <span>👤 ${escapeHtml(c.name)}</span>
              <span>${escapeHtml(c.date)}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `).join('');
    }

    function getLocalComments(key) {
      try { return JSON.parse(localStorage.getItem(`comments_${key}`) || '[]'); } catch (e) { return []; }
    }

    // 공유 저장소에서 해당 날짜의 '아멘' 수와 은혜 나눔을 받아 화면에 반영
    async function loadShared(key) {
      try {
        const res = await fetch(`${SHARE_URL}?key=${encodeURIComponent(key)}`);
        const result = await res.json();
        if (key !== currentKey) return;
        const list = document.getElementById('commentListArea');
        const badge = document.getElementById('amenCountBadge');
        if (list) list.innerHTML = buildCommentsHtml(result.comments || []);
        if (badge) badge.innerText = result.amen || 0;
      } catch (e) {
        const list = document.getElementById('commentListArea');
        if (list && key === currentKey) {
          list.innerHTML = `<div style="text-align:center; font-size:0.82rem; color:var(--text-sub); padding:10px;">은혜 나눔을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>`;
        }
      }
    }

    // 공유 저장소에 기록 (text/plain으로 보내야 구글 앱스 스크립트가 바로 받음)
    function postShared(payload) {
      return fetch(SHARE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    // '아멘' 버튼 클릭 핸들러
    function handleAmen(key) {
      const badge = document.getElementById('amenCountBadge');
      if (SHARE_URL) {
        const shown = parseInt(badge && badge.innerText) || 0;
        if (badge) badge.innerText = shown + 1;
        postShared({ action: 'amen', key }).catch(() => {});
        return;
      }
      const amenKey = `amen_${key}`;
      let count = parseInt(localStorage.getItem(amenKey) || '0');
      count++;
      localStorage.setItem(amenKey, count);
      if (badge) badge.innerText = count;
    }

    // 댓글 등록 핸들러
    async function handlePostComment(key) {
      const nameInput = document.getElementById('commenterName');
      const textInput = document.getElementById('commentText');
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        alert('이름과 내용을 모두 입력해 주세요.');
        return;
      }

      if (SHARE_URL) {
        const btn = document.getElementById('commentSubmitBtn');
        if (btn) { btn.disabled = true; btn.innerText = '등록 중…'; }
        try {
          const result = await postShared({ action: 'comment', key, name, text });
          if (!result.ok) throw new Error('rejected');
          textInput.value = '';
          await loadShared(key);
        } catch (e) {
          alert('등록하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.');
        } finally {
          if (btn) { btn.disabled = false; btn.innerText = '은혜 나누기 등록'; }
        }
        return;
      }

      const comments = getLocalComments(key);
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      comments.unshift({ name, text, date: dateStr });
      localStorage.setItem(`comments_${key}`, JSON.stringify(comments));

      textInput.value = '';
      renderApp(currentKey); // 화면 갱신
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('show');
      });
    }, { threshold: 0.08 });

    renderApp(currentKey);

    setInterval(() => {
      const updatedKeys = getVisibleKeys();
      if (updatedKeys.length !== visibleKeys.length) {
        renderApp(updatedKeys[0]);
      } else if (SHARE_URL && !document.hidden) {
        loadShared(currentKey); // 다른 성도님이 남긴 글도 보이도록 새로고침
      }
    }, 30000);

    const links = document.querySelectorAll('.nav-link');
    const sections = ['top', 'word', 'sermon', 'prayer'];

    window.addEventListener('scroll', () => {
      let current = 'top';
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && window.scrollY >= el.offsetTop - 220) {
          current = id;
        }
      });
      links.forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === '#' + current);
      });
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),
        da: Math.random() * 0.015 + 0.005,
        dy: -(Math.random() * 0.2 + 0.05)
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.y += s.dy;
        s.a += s.da;
        if (s.a > 0.9 || s.a < 0.1) s.da *= -1;
        if (s.y < 0) s.y = canvas.height;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(229, 193, 88, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
</body>
</html>
