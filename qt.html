<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>새벽기도회 은혜의 나눔 (QT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(22, 32, 53, 0.82);
      --gold: #e5c158;
      --gold-soft: #f5e6b8;
      --text-main: #f4f6f9;
      --text-sub: #a9b3c6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(180deg, #131d36 0%, #0a0f1d 100%);
    }

    .mobile-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .serif {
      font-family: 'Nanum Myeongjo', serif;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      transition: all 0.6s ease-out;
    }
    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 상단 날짜 선택 탭 */
    .day-selector-wrap {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(10px);
      margin: 0 -18px;
      padding: 12px 18px 10px;
      border-bottom: 1px solid rgba(229, 193, 88, 0.15);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .day-selector-wrap::-webkit-scrollbar {
      display: none;
    }
    .day-btn {
      background: var(--card-bg);
      border: 1px solid rgba(229, 193, 88, 0.35);
      color: var(--text-sub);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .day-btn.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.35);
    }

    /* 표지 영역 */
    .hero {
      padding: 30px 0 20px;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--gold);
      border: 1px solid rgba(229, 193, 88, 0.4);
      background: rgba(229, 193, 88, 0.08);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: 1.75rem;
      line-height: 1.35;
      color: #fff;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-sub {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .info-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 0.82rem;
    }

    .info-item strong {
      display: block;
      color: var(--gold);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    section {
      margin-bottom: 24px;
      scroll-margin-top: 65px;
    }

    .sec-title {
      font-size: 1.15rem;
      color: var(--gold-soft);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--gold);
      border-radius: 2px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .verse-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.75;
      color: #dbe2ef;
      word-break: keep-all;
    }
    .verse-item:last-child {
      margin-bottom: 0;
    }
    .verse-item.highlight {
      color: #ffffff;
      background: rgba(229, 193, 88, 0.08);
      border-left: 3px solid var(--gold);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }
    .v-num {
      color: var(--gold);
      font-weight: 700;
      margin-right: 6px;
      font-size: 0.88rem;
    }

    .point-card {
      border-left: 3px solid var(--gold);
    }

    .point-tag {
      font-size: 0.72rem;
      color: #0a0f1d;
      background: var(--gold);
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .point-card h3 {
      font-size: 1.12rem;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .point-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .key-quote {
      background: rgba(229, 193, 88, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: var(--gold-soft);
      font-weight: 500;
    }

    .name-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
      text-align: center;
    }
    .name-item {
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .name-old {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sub);
    }
    .name-new {
      background: rgba(229, 193, 88, 0.18);
      border: 1px solid var(--gold);
      color: #fff;
    }

    .prayer-list {
      list-style: none;
    }
    .prayer-list li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      color: var(--text-main);
    }
    .prayer-list li:last-child {
      margin-bottom: 0;
    }
    .prayer-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--gold);
    }
    .prayer-list strong {
      color: var(--gold-soft);
      display: block;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .cry-box {
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.2), rgba(22, 32, 53, 0.95));
      border: 1px solid var(--gold);
      text-align: center;
    }
    .cry-title {
      font-size: 1.25rem;
      color: var(--gold);
      font-weight: 800;
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 440px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 193, 88, 0.35);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      padding: 10px 6px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .bottom-nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 16px;
      transition: all 0.2s;
    }
    .bottom-nav a.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
    }
  </style>
</head>

        time: "새벽 4:00",
        
        openingPrayer: "시온을 위하여 쉬지 않으시는 하나님 아버지, 세상의 시선에 흔들려 스스로를 '버림받은 자'처럼 여겼던 연약함을 내려놓습니다. 오늘 우리를 '헵시바'와 '쁄라'라 부르시는 주님의 음성을 듣고, 거룩한 기도의 파수꾼으로 일어서게 하옵소서. 아멘.",
        
        verses: [
          { num: "1", key: true, text: "나는 시온의 의가 빛 같이, 예루살렘의 구원이 횃불 같이 나타나도록 <strong>시온을 위하여 잠잠하지 아니하며 예루살렘을 위하여 쉬지 아니할 것인즉</strong>" },
          { num: "2", text: "이방 나라들이 네 공의를, 뭇 왕이 다 네 영광을 볼 것이요 너는 여호와의 입으로 정하실 새 이름으로 일컬음이 될 것이며" },

          { num: "4", key: true, text: "다시는 너를 버림 받은 자라 부르지 아니하며 다시는 네 땅을 황무지라 부르지 아니하고 오직 너를 <strong>헵시바</strong>라 하며 네 땅을 <strong>쁄라</strong>라 하리니 이는 여호와께서 너를 기뻐하실 것이며 네 땅이 결혼한 것처럼 될 것임이라" },
          { num: "5", key: true, text: "마치 청년이 처녀와 결혼함 같이 네 아들들이 너를 취하겠고 <strong>신랑이 신부를 기뻐함 같이 네 하나님이 너를 기뻐하시리라</strong>" },
          { num: "6", text: "예루살렘이여 내가 너의 성벽 위에 파수꾼을 세우고 그들로 하여금 주야로 계속 잠잠하지 않게 하였느니라 너희 여호와로 기억하시게 하는 자들아 너희는 쉬지 말며" },
          { num: "7", text: "또 여호와께서 예루살렘을 세워 세상에서 찬송을 받게 하시기까지 그로 쉬지 못하시게 하라" },
          { num: "8", text: "여호와께서 그 오른손, 그 능력의 팔로 맹세하시되 내가 다시는 네 곡식을 네 원수들에게 양식으로 주지 아니하겠고 네가 수고하여 얻은 포도주를 이방인이 마시지 못하게 할 것인즉" },
          { num: "9", text: "오직 추수한 자가 그것을 먹고 나 여호와를 찬송할 것이요 거둔 자가 그것을 나의 성소 뜰에서 마시리라 하셨느니라" },
          { num: "10", text: "성문으로 나아가라 나아가라 백성이 올 길을 닦으라 큰 길을 수축하고 수축하라 돌을 제하라 만민을 위하여 기치를 들라" },
          { num: "11", text: "여호와께서 땅 끝까지 선포하시되 너희는 딸 시온에게 이르라 보라 네 구원이 이르렀느니라 보라 상급이 그에게 있고 보응이 그 앞에 있느니라 하셨느니라" },
          { num: "12", key: true, text: "사람들이 너를 일컬어 <strong>거룩한 백성이라 여호와께서 구속하신 자라</strong> 하겠고 또 너를 일컬어 찾은 바 된 자요 버림 받지 아니한 성읍이라 하리라" }
        ],

        points: [
          {
            tag: "은혜 01",
            title: "하나님은 우리를 위해 결코 쉬지 않으십니다 (1, 6-7절)",
            desc: "세상이 우리를 포기할 때에도 하나님은 우리의 회복을 위해 잠잠하지 않고 일하십니다. 그리고 우리를 <strong>'성벽 위 파수꾼'</strong>으로 부르셔서, 우리의 기도를 통해 일하시겠다고 약속하십니다.",
            quote: "💡 오늘 우리의 새벽 기도는 쉬지 않으시는 하나님의 열심과 만나는 거룩한 통로입니다."
          },
          {
            tag: "은혜 02",
            title: "'버림받은 자'가 아니라 '헵시바'와 '쁄라'입니다 (2-5절)",
            desc: "스스로를 향해 \"나는 안 된다\"고 부르던 옛 이름을 내려놓으십시오. 우리는 하나님의 손에 들린 아름다운 왕관이며, 신랑이 기뻐하는 신부입니다.",
            compareBox: {
              oldLabel: "과거의 이름",
              oldVal: "버림받은 자 · 황무지",
              newLabel: "주님이 주신 새 이름",
              newVal: "헵시바 · 쁄라"
            },
            quote: "💡 <strong>헵시바:</strong> 나의 기쁨이 그에게 있다<br>💡 <strong>쁄라:</strong> 결혼한 여인 (주님의 신부)"
          },
          {
            tag: "은혜 03",
            title: "길을 닦고 구원의 기치를 높이 드십시오 (10-12절)",
            desc: "사랑으로 회복된 백성에게는 <strong>'나아가라'</strong>는 사명이 주어집니다. 삶의 자리에서 걸림돌을 제하고, 만민을 향해 오직 예수 그리스도의 구원의 깃발(기치)을 높이 드는 성도가 되십시오.",
            quote: "💡 우리의 최종 이름은 <strong>'찾은 바 된 자요, 버림받지 아니한 거룩한 성읍'</strong>입니다."
          }
        ],

        prayers: [
          { title: "1. 정체성 회복을 위하여", desc: "세상의 평가나 자책에서 벗어나, 나를 '헵시바'와 '쁄라'라 부르시는 하나님의 절대적인 사랑을 확신하게 하소서." },
          { title: "2. 쉬지 않는 기도의 파수꾼", desc: "가정과 교회, 민족의 성벽 위에 깨어 서서 주님이 역사하실 때까지 쉬지 않고 부르짖게 하소서." },
          { title: "3. 구원의 기치를 드는 삶", desc: "무너진 삶의 자리에서 길을 닦고 돌을 제하며, 세상 가운데 그리스도의 기치를 높이 들게 하소서." },
          { title: "4. 환우와 지친 성도들의 회복", desc: "질병과 어려움 가운데 있는 성도들의 가정과 일터를 붙드시고 새 힘과 치유를 허락하소서." }
        ],

        cryIntro: "나를 기뻐하시는 주님의 음성을 붙들고<br>함께 부르짖어 기도합시다!",
        cryPrayer: "우리를 위하여 잠시도 쉬지 않으시는 하나님 아버지! 우리는 더 이상 버림받은 자가 아니라 주님의 손에 들린 아름다운 왕관이며 기쁨의 신부임을 고백합니다. 오늘 파수꾼으로 일어나 가정과 교회와 환우들을 위해 부르짖사오니, 우리의 기도가 하늘 보좌에 상달되게 하옵소서. 예수님의 이름으로 기도합니다. 아멘!"
      }
    };

    const keys = Object.keys(sermons);
    let currentKey = keys[0];

    function renderApp(targetKey) {
      currentKey = targetKey;
      const data = sermons[targetKey];

      let selectorHtml = '';
      keys.forEach((k) => {
        const activeClass = k === targetKey ? 'active' : '';
        selectorHtml += `<button class="day-btn ${activeClass}" onclick="renderApp('${k}')">${sermons[k].tabLabel}</button>`;
      });
      document.getElementById('daySelector').innerHTML = selectorHtml;

      let versesHtml = '';
      data.verses.forEach(v => {
        const highlightClass = v.key ? 'highlight' : '';
        versesHtml += `<div class="verse-item ${highlightClass}"><span class="v-num">${v.num}</span>${v.text}</div>`;
      });

      let pointsHtml = '';
      data.points.forEach(p => {
        let compareHtml = '';
        if (p.compareBox) {
          compareHtml = `
            <div class="name-box">
              <div class="name-item name-old">
                <small>${p.compareBox.oldLabel}</small><br><strong>${p.compareBox.oldVal}</strong>
              </div>
              <div class="name-item name-new">
                <small>${p.compareBox.newLabel}</small><br><strong>${p.compareBox.newVal}</strong>
              </div>
            </div>
          `;
        }

        pointsHtml += `
          <div class="card point-card fade-up">
            <span class="point-tag">${p.tag}</span>
            <h3 class="serif">${p.title}</h3>
            <p class="point-desc">${p.desc}</p>
            ${compareHtml}
            <div class="key-quote">${p.quote}</div>
          </div>
        `;
      });

      let prayersHtml = '';
      data.prayers.forEach(pr => {
        prayersHtml += `
          <li>
            <strong>${pr.title}</strong>
            ${pr.desc}
          </li>
        `;
      });

      const contentHtml = `
        <header class="hero fade-up" id="top">
          <div class="date-badge">${data.dateBadge}</div>
          <h1 class="serif">${data.titleHtml}</h1>
          <p class="hero-sub">${data.subtitle}</p>

          <div class="info-bar">
            <div class="info-item">
              <strong>본문</strong>
              <span>${data.bibleRange}</span>
            </div>
            <div class="info-item">
              <strong>찬송</strong>
              <span>${data.hymn}</span>
            </div>
            <div class="info-item">
              <strong>시간</strong>
              <span>${data.time}</span>
            </div>
          </div>
        </header>

        <section id="word" class="fade-up">
          <h2 class="sec-title serif">오늘의 성경 본문 (${data.bibleRange})</h2>
          <div class="card serif">
            ${versesHtml}
          </div>
        </section>

        <section id="sermon">
          <h2 class="sec-title serif fade-up">오늘의 말씀 핵심</h2>
          ${pointsHtml}
        </section>

        <section id="prayer" class="fade-up">
          <h2 class="sec-title serif">오늘의 공동 기도 제목</h2>
          
          <div class="card">
            <ul class="prayer-list">${prayersHtml}</ul>
          </div>

          <div class="card cry-box fade-up">
            <span class="point-tag">새벽 4시 합심 기도</span>
            <p style="font-size: 0.9rem; color: #fff;">${data.cryIntro}</p>
            <div class="cry-title serif">주여! 주여! 주여!</div>
            
            <p style="font-size: 0.9rem; color: var(--gold-soft); text-align: left; margin-top: 10px;">
              "${data.cryPrayer}"
            </p>
          </div>
        </section>
      `;

      document.getElementById('contentArea').innerHTML = contentHtml;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('show');
      });
    }, { threshold: 0.08 });

    renderApp(currentKey);

    const links = document.querySelectorAll('.nav-link');
    const sections = ['top', 'word', 'sermon', 'prayer'];

    window.addEventListener('scroll', () => {
      let current = 'top';
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && window.scrollY >= el.offsetTop - 220) {
          current = id;
        }
      });
      links.forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === '#' + current);
      });
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),
        da: Math.random() * 0.015 + 0.005,
        dy: -(Math.random() * 0.2 + 0.05)
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.y += s.dy;
        s.a += s.da;
        if (s.a > 0.9 || s.a < 0.1) s.da *= -1;
        if (s.y < 0) s.y = canvas.height;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(229, 193, 88, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
</body>
</html>
