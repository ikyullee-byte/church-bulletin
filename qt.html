<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1d">
  <title>새벽기도회 은혜의 나눔 (QT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080c18;
      --bg-2: #101a33;
      --card: rgba(20, 30, 52, 0.66);
      --card-border: rgba(255, 255, 255, 0.07);
      --gold: #e6c667;
      --gold-deep: #b8913a;
      --gold-soft: #f5e8bf;
      --text: #eef1f7;
      --text-sub: #a3aec4;
      --radius: 20px;
      --fs: 1;
      --grad-gold: linear-gradient(135deg, #f7e7a9 0%, #e6c667 45%, #b8913a 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 50% -5%, rgba(230, 198, 103, 0.16), transparent 60%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 70%);
    }

    /* 읽기 진행바 */
    .progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--grad-gold); z-index: 200;
      box-shadow: 0 0 10px rgba(230, 198, 103, 0.6);
      transition: width 0.1s linear;
    }

    .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }
    .serif { font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; }

    .fade-up { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.7,.2,1); }
    .fade-up.show { opacity: 1; transform: none; }

    /* 상단 바: 날짜 탭 + 글자 크기 */
    .topbar {
      position: sticky; top: 0; z-index: 90;
      margin: 0 -20px; padding: 12px 20px 10px;
      background: linear-gradient(180deg, rgba(8, 12, 24, 0.95), rgba(8, 12, 24, 0.75));
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(230, 198, 103, 0.14);
      display: flex; align-items: center; gap: 10px;
    }
    .topbar { justify-content: space-between; }
    .top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .mode-chip {
      flex-shrink: 0; font-size: 0.78rem; font-weight: 700; color: #1a1405;
      background: var(--grad-gold); padding: 7px 14px; border-radius: 999px;
      box-shadow: 0 4px 16px rgba(230, 198, 103, 0.28);
    }
    .mode-chip.past { background: rgba(255, 255, 255, 0.08); color: var(--gold-soft); box-shadow: none; border: 1px solid rgba(230, 198, 103, 0.3); }
    .past-btn {
      font-family: inherit; flex-shrink: 0; background: transparent; cursor: pointer;
      border: 1px solid rgba(230, 198, 103, 0.3); color: var(--text-sub);
      padding: 7px 13px; border-radius: 999px; font-size: 0.78rem; font-weight: 500; transition: all 0.25s;
    }
    .past-btn[aria-expanded="true"] { color: var(--gold); border-color: var(--gold); background: rgba(230, 198, 103, 0.08); }
    .past-btn .caret { display: inline-block; transition: transform 0.25s; font-size: 0.7rem; }
    .past-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }

    .past-panel {
      position: absolute; top: calc(100% + 8px); left: 20px; right: 20px; z-index: 95;
      display: flex; flex-direction: column; gap: 6px; padding: 12px;
      max-height: 60vh; overflow-y: auto;
      background: rgba(14, 22, 42, 0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(230, 198, 103, 0.3); border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      animation: dropIn 0.22s ease-out;
    }
    .past-panel[hidden] { display: none; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .past-head { font-size: 0.7rem; color: var(--gold); letter-spacing: 2px; padding: 2px 6px 4px; }
    .past-item {
      font-family: inherit; text-align: left; cursor: pointer; display: grid; gap: 1px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px; padding: 11px 13px; color: var(--text); transition: all 0.2s;
    }
    .past-item:active { background: rgba(230, 198, 103, 0.12); }
    .past-item.current { border-color: var(--gold); background: rgba(230, 198, 103, 0.1); }
    .past-item.back { background: rgba(230, 198, 103, 0.12); border-color: rgba(230, 198, 103, 0.45); color: var(--gold-soft); font-weight: 700; font-size: 0.85rem; }
    .pi-date { font-size: 0.72rem; color: var(--gold); font-weight: 700; }
    .pi-title { font-size: 0.88rem; line-height: 1.45; word-break: keep-all; }
    .pi-range { font-size: 0.72rem; color: var(--text-sub); }
    .size-ctrl { display: flex; flex-shrink: 0; border: 1px solid rgba(230, 198, 103, 0.3); border-radius: 999px; overflow: hidden; }
    .size-ctrl button {
      font-family: 'Noto Sans KR', sans-serif; background: transparent; border: 0; color: var(--gold);
      width: 34px; height: 32px; cursor: pointer; font-weight: 700;
    }
    .size-ctrl button:first-child { font-size: 0.72rem; border-right: 1px solid rgba(230, 198, 103, 0.25); }
    .size-ctrl button:last-child { font-size: 0.98rem; }
    .size-ctrl button:active { background: rgba(230, 198, 103, 0.15); }

    /* 표지 */
    .hero { padding: 46px 0 30px; text-align: center; position: relative; }
    .cross {
      width: 26px; height: 34px; margin: 0 auto 18px; position: relative; opacity: 0.9;
      filter: drop-shadow(0 0 10px rgba(230, 198, 103, 0.55));
    }
    .cross::before, .cross::after { content: ''; position: absolute; background: var(--grad-gold); border-radius: 2px; }
    .cross::before { left: 50%; top: 0; width: 4px; height: 100%; transform: translateX(-50%); }
    .cross::after { top: 30%; left: 0; width: 100%; height: 4px; }

    .date-badge {
      display: inline-block; font-size: 0.74rem; color: var(--gold);
      border: 1px solid rgba(230, 198, 103, 0.35); background: rgba(230, 198, 103, 0.07);
      padding: 5px 16px; border-radius: 999px; margin-bottom: 20px; letter-spacing: 1.5px;
    }
    .hero h1 { font-size: 1.85rem; line-height: 1.4; color: #fff; margin-bottom: 12px; word-break: keep-all; font-weight: 800; }
    .hero h1 span {
      background: var(--grad-gold); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: var(--gold);
    }
    .hero-sub { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 26px; word-break: keep-all; }

    .info-bar {
      display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 14px 10px; font-size: 0.86rem;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .info-bar .divider { height: 30px; background: rgba(230, 198, 103, 0.25); }
    .info-item strong { display: block; color: var(--gold); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 2px; font-weight: 500; }

    /* 섹션 */
    section { margin-bottom: 34px; scroll-margin-top: 70px; }
    .sec-title {
      font-size: 1.12rem; color: var(--gold-soft); margin-bottom: 14px;
      display: flex; align-items: center; gap: 12px; font-weight: 700;
    }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(230, 198, 103, 0.4), transparent); }

    .card {
      background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 22px 20px; margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* 시작 기도 */
    .opening { position: relative; padding-top: 34px; }
    .opening::before {
      content: '“'; position: absolute; top: 2px; left: 18px;
      font-family: 'Noto Sans KR', sans-serif; font-size: 3.4rem; line-height: 1; color: var(--gold); opacity: 0.55;
    }
    .opening p { font-size: calc(0.92rem * var(--fs)); color: var(--gold-soft); line-height: 1.85; word-break: keep-all; }

    /* 성경 본문 */
    .bible-card { padding: 22px 18px; }
    .verse-item {
      margin-bottom: 4px; font-size: calc(1rem * var(--fs)); line-height: 1.95;
      color: #d9e0ee; word-break: keep-all; padding: 6px 10px; border-radius: 10px;
    }
    .verse-item.highlight {
      color: #fff; background: linear-gradient(90deg, rgba(230, 198, 103, 0.14), rgba(230, 198, 103, 0.03));
      border-left: 3px solid var(--gold); border-radius: 4px 12px 12px 4px; font-weight: 700;
    }
    .verse-item strong { color: var(--gold); font-weight: 800; }
    .v-num { color: var(--gold); font-weight: 700; margin-right: 8px; font-size: 0.72em; vertical-align: super; font-family: 'Noto Sans KR', sans-serif; }

    /* 설교 포인트 */
    .point-card { position: relative; overflow: hidden; }
    .point-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad-gold);
    }
    .point-tag {
      font-size: 0.7rem; color: #1a1405; background: var(--grad-gold); font-weight: 700;
      padding: 3px 11px; border-radius: 999px; display: inline-block; margin-bottom: 10px; letter-spacing: 0.5px;
    }
    .point-card h3 { font-size: calc(1.1rem * var(--fs)); color: #fff; margin-bottom: 10px; line-height: 1.5; word-break: keep-all; }
    .point-desc { font-size: calc(0.92rem * var(--fs)); color: var(--text-sub); margin-bottom: 14px; line-height: 1.8; word-break: keep-all; }
    .point-desc strong { color: var(--gold-soft); }
    .key-quote {
      background: rgba(230, 198, 103, 0.09); border: 1px solid rgba(230, 198, 103, 0.2);
      border-radius: 12px; padding: 13px 15px; font-size: calc(0.88rem * var(--fs));
      color: var(--gold-soft); font-weight: 500; line-height: 1.75; word-break: keep-all;
    }

    .name-box { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 8px; margin: 14px 0; text-align: center; }
    .name-item { padding: 13px 8px; border-radius: 12px; font-size: 0.84rem; line-height: 1.5; }
    .name-item small { display: block; font-size: 0.7rem; margin-bottom: 3px; opacity: 0.8; }
    .name-old { background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.15); color: var(--text-sub); }
    .name-new { background: rgba(230, 198, 103, 0.16); border: 1px solid var(--gold); color: #fff; box-shadow: 0 0 18px rgba(230, 198, 103, 0.18); }
    .name-arrow { align-self: center; color: var(--gold); font-size: 1.1rem; }

    /* 기도 제목 */
    .prayer-list { list-style: none; counter-reset: p; }
    .prayer-list li {
      display: flex; gap: 14px; padding: 14px 0; font-size: calc(0.9rem * var(--fs));
      color: var(--text-sub); line-height: 1.75; word-break: keep-all;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .prayer-list li:first-child { padding-top: 0; }
    .prayer-list li:last-child { border-bottom: 0; padding-bottom: 0; }
    .p-num {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(230, 198, 103, 0.12); border: 1px solid rgba(230, 198, 103, 0.45);
      color: var(--gold); font-weight: 700; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }
    .prayer-list strong { color: var(--gold-soft); display: block; font-size: calc(0.96rem * var(--fs)); margin-bottom: 2px; }

    /* 합심기도 */
    .cry-box {
      text-align: center; position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(230, 198, 103, 0.2), rgba(16, 26, 51, 0.92) 60%);
      border: 1px solid rgba(230, 198, 103, 0.6);
      box-shadow: 0 0 40px rgba(230, 198, 103, 0.14), 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .cry-box::after {
      content: ''; position: absolute; width: 220px; height: 220px; top: -90px; right: -70px;
      background: radial-gradient(circle, rgba(230, 198, 103, 0.22), transparent 70%); pointer-events: none;
    }
    .cry-intro { font-size: calc(0.9rem * var(--fs)); color: #fff; line-height: 1.7; position: relative; }
    .cry-title {
      font-size: 1.6rem; font-weight: 800; margin: 12px 0 14px; letter-spacing: 3px; position: relative;
      background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: glow 2.4s ease-in-out infinite alternate;
    }
    @keyframes glow { from { filter: drop-shadow(0 0 2px rgba(230, 198, 103, 0.2)); } to { filter: drop-shadow(0 0 12px rgba(230, 198, 103, 0.7)); } }
    .cry-prayer {
      font-size: calc(0.9rem * var(--fs)); color: var(--gold-soft); text-align: left; line-height: 1.9;
      margin-top: 8px; padding-top: 16px; border-top: 1px solid rgba(230, 198, 103, 0.25); word-break: keep-all; position: relative;
    }

    .footer-note { text-align: center; color: var(--text-sub); font-size: 0.76rem; padding: 6px 0 10px; letter-spacing: 1px; opacity: 0.8; }
    .footer-note .orn { color: var(--gold); display: block; margin-bottom: 4px; font-size: 0.9rem; }

    /* 하단 네비 */
    .bottom-nav {
      position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 440px;
      background: rgba(12, 19, 38, 0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(230, 198, 103, 0.3); border-radius: 999px;
      display: flex; justify-content: space-around; padding: 7px; z-index: 100;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .bottom-nav a {
      flex: 1; text-align: center; color: var(--text-sub); text-decoration: none;
      font-size: 0.78rem; font-weight: 500; padding: 8px 0; border-radius: 999px; transition: all 0.25s;
    }
    .bottom-nav a.active { background: var(--grad-gold); color: #1a1405; font-weight: 700; box-shadow: 0 4px 14px rgba(230, 198, 103, 0.3); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fade-up { opacity: 1; transform: none; transition: none; }
      .cry-title { animation: none; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="progress" id="progress"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="top-left">
        <span class="mode-chip" id="modeChip">오늘의 말씀</span>
        <button type="button" class="past-btn" id="pastBtn" aria-expanded="false" onclick="togglePast(event)">지난 설교 보기 <span class="caret">▾</span></button>
      </div>
      <div class="past-panel" id="pastPanel" hidden></div>
      <div class="size-ctrl" aria-label="글자 크기">
        <button type="button" onclick="changeSize(-0.1)" aria-label="글자 작게">가</button>
        <button type="button" onclick="changeSize(0.1)" aria-label="글자 크게">가</button>
      </div>
    </div>
    <div id="contentArea"></div>
  </div>

  <nav class="bottom-nav">
    <a href="#top" class="nav-link active">표지</a>
    <a href="#word" class="nav-link">말씀본문</a>
    <a href="#sermon" class="nav-link">설교핵심</a>
    <a href="#prayer" class="nav-link">합심기도</a>
  </nav>

  <script>
    // =========================================================================
    // 📂 [성도용 새벽기도 나눔 데이터]
    // =========================================================================
    const sermons = {
      "2026-10-19": {
        tabLabel: "10.19 (월)",
        dateBadge: "2026. 10. 19 (월) 새벽기도회",
        titleHtml: "<span>새 일을 행하시는</span><br>하나님과 첫날의 믿음",
        subtitle: "종일토록 손을 펼치시는 주님의 품으로",
        bibleRange: "이사야 65:1-16",
        hymn: "370장 · 455장",

        openingPrayer: "새로운 한 주의 첫 문을 여는 월요일 새벽, 세상의 염려와 막막함을 주님 앞에 내려놓습니다. 종일토록 두 손을 펼치사 우리를 기다리시는 아버지의 품 안에서, 실패와 상처의 아골 골짜기가 변하여 축복의 땅이 되는 역사를 보게 하옵소서. 아멘.",

        verses: [
          { num: "1", key: true, text: "나는 나를 구하지 아니하던 자에게 물음을 받았으며 나를 찾지 아니하던 자에게 찾아 발견됨을 받았으며 내가 이름을 부르지 아니하던 나라에게 <strong>내가 여기 있노라 내가 여기 있노라</strong> 하였노라" },
          { num: "2", key: true, text: "내가 종일 내 손을 펼쳐 자기의 생각을 따라 불선한 길을 행하는 패역한 백성들을 불렀나니" },
          { num: "3", text: "곧 동산에서 제사하며 벽돌 위에서 분향하여 내 앞에서 항상 나의 진노를 일으키는 백성이라" },
          { num: "4", text: "그들이 무덤 사이에 앉으며 은밀한 곳에서 밤을 보내며 돼지고기를 먹으며 가증한 것들의 국을 그들의 그릇에 담으면서" },
          { num: "5", text: "사람에게 이르기를 너는 네 자리에 서 있고 내게 가까이 하지 말라 나는 너보다 거룩함이라 하나니 이런 자들은 내 코의 연기요 종일 타는 불이로다" },
          { num: "6", text: "보라 이것이 내 앞에 기록되었으니 내가 잠잠하지 아니하고 반드시 보응하되 그들의 품에 보응하리라" },
          { num: "7", text: "너희의 죄악과 너희 조상들의 죄악이 한가지니 그들이 산 위에서 분향하며 작은 산 위에서 나를 능욕하였음이라 그러므로 내가 먼저 그들의 행위를 헤아리고 그들의 품에 보응하리라 여호와가 말하였느니라" },
          { num: "8", text: "여호와께서 이와 같이 말씀하시되 포도송이에는 즙이 있으므로 사람들이 말하기를 그것을 상하지 못하게 하라 거기에 복이 있느니라 하나니 나도 내 종들을 위하여 그같이 행하여 다 멸하지 아니하고" },
          { num: "9", text: "내가 야곱에게서 씨를 내며 유다에게서 나의 산들을 기업으로 얻을 자를 내리니 내가 택한 자가 이를 기업으로 얻을 것이요 나의 종들이 거기에 살 것이라" },
          { num: "10", key: true, text: "<strong>사론</strong>은 양 떼의 우리가 되겠고 <strong>아골 골짜기</strong>는 소 떼가 눕는 곳이 되어 나를 찾은 내 백성의 소유가 되려니와" },
