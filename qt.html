<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>새벽기도회 은혜의 나눔 (QT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(22, 32, 53, 0.82);
      --gold: #e5c158;
      --gold-soft: #f5e6b8;
      --text-main: #f4f6f9;
      --text-sub: #a9b3c6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* 배경 별빛 캔버스 */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(180deg, #131d36 0%, #0a0f1d 100%);
    }

    /* 모바일 컨테이너 (최대 폭 480px 고정) */
    .mobile-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .serif {
      font-family: 'Nanum Myeongjo', serif;
    }

    /* 스크롤 등장 애니메이션 */
    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      transition: all 0.6s ease-out;
    }
    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 상단 날짜 선택 탭 (고정형) */
    .day-selector-wrap {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(10, 15, 29, 0.9);
      backdrop-filter: blur(10px);
      margin: 0 -18px;
      padding: 12px 18px 10px;
      border-bottom: 1px solid rgba(229, 193, 88, 0.15);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .day-selector-wrap::-webkit-scrollbar {
      display: none;
    }
    .day-btn {
      background: var(--card-bg);
      border: 1px solid rgba(229, 193, 88, 0.35);
      color: var(--text-sub);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .day-btn.active {
      background: var(--gold);
      color: #0a0f1d;
      font-weight: 700;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.35);
    }

    /* 1. 상단 표지 */
    .hero {
      padding: 38px 0 28px;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--gold);
      border: 1px solid rgba(229, 193, 88, 0.4);
      background: rgba(229, 193, 88, 0.08);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 1px
