<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>추수감사절 성경 퀴즈 모의고사 - 원종제일교회</title>
    
    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');
        
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #FFFDFB; 
            color: #334155; 
            letter-spacing: -0.03em;
            overflow-x: hidden;
        }

        .premium-card { 
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(253, 230, 138, 0.8);
            transition: all 0.3s ease;
        }
        
        .glass-nav { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: saturate(180%) blur(20px); 
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(253, 230, 138, 0.5);
        }

        /* 퀴즈 아코디언 스타일 */
        .quiz-item { 
            background: #FFFFFF;
            border: 1px solid #FEF3C7; 
            border-radius: 20px;
            padding: 18px 20px; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px -4px rgba(245, 158, 11, 0.05);
        }
        .quiz-item:hover { border-color: #FCD34D; }
        .quiz-question { font-size: 15px; font-weight: 700; color: #451A03; display: flex; gap: 10px; cursor: pointer; user-select: none; line-height: 1.5; align-items: flex-start; }
        .quiz-question .q-mark { color: #D97706; font-weight: 900; flex-shrink: 0; background: #FFFBEB; padding: 2px 8px; border-radius: 8px; font-size: 13px; border: 1px solid #FDE68A; }
        .quiz-answer { display: none; margin-top: 14px; padding: 14px 16px; background-color: #FFFBEB; border-radius: 14px; font-size: 14px; font-weight: 800; color: #D97706; border: 1px dashed #FCD34D; line-height: 1.5; }
        .quiz-answer.show { display: block; animation: slideDown 0.25s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        /* 글자 확대 모드 */
        body.large-text .quiz-question { font-size: 1.15rem; }
        body.large-text .quiz-answer { font-size: 1.1rem; }

        /* 다크 모드 */
        body.dark-mode { background-color: #1C1917 !important; color: #F8FAFC !important; }
        body.dark-mode .premium-card { background-color: #292524 !important; border-color: #44403C !important; }
        body.dark-mode .glass-nav { background: rgba(41, 37, 36, 0.85) !important; border-color: #44403C !important; }
        body.dark-mode .quiz-item { background-color: #292524 !important; border-color: #44403C !important; }
        body.dark-mode .quiz-question { color: #F1F5F9 !important; }
        body.dark-mode .quiz-question .q-mark { background-color: #451A03 !important; color: #FCD34D !important; border-color: #78350F !important; }
        body.dark-mode .quiz-answer { background-color: #1C1917 !important; color: #FCD34D !important; border-color: #78350F !important; }
    </style>
</head>
<body class="pb-20">

    <!-- 상단 네비게이션 바 -->
    <nav class="glass-nav sticky top-0 z-[100] px-5 py-3.5 flex justify-between items-center">
        <a href="index.html" class="inline-flex items-center gap-2 bg-amber-50 hover:bg-amber-100 text-amber-700 font-extrabold text-xs px-4 py-2.5 rounded-full border border-amber-200 transition-all active:scale-95 shadow-sm">
            <i class="fas fa-arrow-left"></i> 주보 메인으로
        </a>
        <div class="flex gap-2.5">
            <button onclick="document.body.classList.toggle('large-text')" class="w-10 h-10 bg-amber-50/70 border border-amber-200 hover:bg-amber-100 rounded-full flex items-center justify-center text-amber-600 active:scale-95 transition-all shadow-sm"><i class="fas fa-search-plus"></i></button>
            <button onclick="document.body.classList.toggle('dark-mode')" class="w-10 h-10 bg-amber-50/70 border border-amber-200 hover:bg-amber-100 rounded-full flex items-center justify-center text-amber-600 active:scale-95 transition-all shadow-sm"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <!-- 서브 페이지 헤더 -->
    <header class="mx-5 mt-5 p-8 premium-card bg-gradient-to-br from-amber-400 via-yellow-500 to-orange-500 border-none text-center relative overflow-hidden shadow-lg">
        <div class="relative z-10 space-y-2 text-white">
            <span class="inline-block bg-white/20 backdrop-blur-sm text-yellow-100 text-[10px] font-black tracking-[0.25em] py-1 px-3.5 rounded-full border border-white/30 uppercase">Golden Bell Quiz 500</span>
            <h1 class="text-2xl md:text-3xl font-black tracking-tight drop-shadow-sm">추수감사절 성경 퀴즈 모의고사 🏆</h1>
            <p class="text-xs font-bold text-yellow-50">총 500문제 중 매번 10문제가 무작위로 출제됩니다!</p>
        </div>
    </header>

    <main class="container mx-auto px-5 py-8 max-w-3xl">

        <!-- 컨트롤 바 -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-6 px-1">
            <span class="text-xs font-extrabold text-amber-800 bg-amber-100/80 px-3 py-1.5 rounded-xl border border-amber-200">
                💡 문제를 터치하면 정답이 열립니다
            </span>
            <div class="flex gap-2">
                <button onclick="toggleAllAnswers()" id="btn-toggle-all" class="text-xs font-bold text-slate-600 bg-white hover:bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200 shadow-sm transition-all active:scale-95">
                    <i class="fas fa-eye mr-1 text-amber-500"></i> 정답 모두 보기
                </button>
                <button onclick="refreshQuiz()" class="text-xs font-black text-white bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 px-4 py-2 rounded-xl shadow-md transition-all flex items-center gap-1.5 active:scale-95">
                    <i class="fas fa-sync-alt"></i> 새 10문제 뽑기
                </button>
            </div>
        </div>

        <!-- 퀴즈 리스트 렌더링 영역 -->
        <div id="quiz-container" class="space-y-3.5"></div>

        <!-- 하단 버튼 -->
        <div class="mt-8 flex flex-col sm:flex-row gap-3">
            <button onclick="refreshQuiz(); window.scrollTo({top: 0, behavior: 'smooth'});" class="flex-1 py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-sm rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-redo-alt"></i> 다른 10문제 새로 풀기
            </button>
            <a href="index.html" class="sm:w-48 py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-home"></i> 주보 메인으로
            </a>
        </div>

    </main>

    <script>
        // 총 500개 퀴즈 데이터베이스
        const rawQuizText = `

        let allQuizzes = [];
        let allAnswersVisible = false;

        function initQuiz() {
            const lines = rawQuizText.split('\n');
            for(let line of lines) {
                if(line.includes('/ 정답:')) {
                    let parts = line.split('/ 정답:');
                    let qText = parts[0].trim().replace(/^\d+\.\s*/, '');
                    let aText = parts[1].trim();
                    allQuizzes.push({ q: qText, a: aText });
                }
            }
            refreshQuiz();
        }

        function refreshQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            allAnswersVisible = false;
            updateToggleButtonText();
            
            let shuffled = [...allQuizzes].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 10);

            selected.forEach((quiz, idx) => {
                let html = `
                <div class="quiz-item" onclick="toggleQuiz(this)">
                    <div class="quiz-question">
                        <span class="q-mark">Q${idx+1}</span>
                        <div class="flex-1">${quiz.q}</div>
                        <i class="fas fa-chevron-down text-amber-400 text-xs mt-1.5 transition-transform"></i>
                    </div>
                    <div class="quiz-answer">💡 정답: ${quiz.a}</div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function toggleQuiz(element) {
            const answer = element.querySelector('.quiz-answer');
            answer.classList.toggle('show');
        }

        function toggleAllAnswers() {
            allAnswersVisible = !allAnswersVisible;
            const answers = document.querySelectorAll('.quiz-answer');
            answers.forEach(ans => {
                if (allAnswersVisible) ans.classList.add('show');
                else ans.classList.remove('show');
            });
            updateToggleButtonText();
        }

        function updateToggleButtonText() {
            const btn = document.getElementById('btn-toggle-all');
            if (allAnswersVisible) {
                btn.innerHTML = `<i class="fas fa-eye-slash mr-1 text-slate-400"></i> 정답 모두 가리기`;
            } else {
                btn.innerHTML = `<i class="fas fa-eye mr-1 text-amber-500"></i> 정답 모두 보기`;
            }
        }

        window.onload = () => {
            initQuiz();
        };
